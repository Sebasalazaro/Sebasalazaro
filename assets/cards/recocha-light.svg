<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 240" width="454" height="240" role="img" aria-label="Recocha: recocha.app ↗">
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#1f62c4"/><stop offset="1" stop-color="#6b47d6"/></linearGradient>
    <style>
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',Consolas,Menlo,'DejaVu Sans Mono',monospace; }
      .kicker { font-size: 11px; fill: #5c6880; letter-spacing: 1.5px; }
      .name { font-size: 20px; font-weight: 700; fill: #14213d; }
      .tagline { font-size: 13px; fill: #1f62c4; }
      .desc { font-size: 12px; fill: #5c6880; }
      .stack { font-size: 11px; fill: #6b47d6; }
      .badge { font-size: 11px; font-weight: 700; fill: #4b3a9a; letter-spacing: .5px; }
    </style>
  </defs>
  <g transform="translate(12 12)">
  <rect x=".5" y=".5" width="429" height="215" rx="12" fill="#f6f8fd" stroke="#d3dcec"/>
  <rect x="26" y="0" width="56" height="3" rx="1.5" fill="url(#edge)"/>

  <text class="kicker" x="26" y="34">SOCIAL · SPORTS</text>
  <text class="name" x="26" y="63">Recocha</text>
  <text class="tagline" x="26" y="85">recocha.app ↗</text>
  <text class="desc" x="26" y="114">La polla del mundial entre amigos: World Cup 2026</text>
  <text class="desc" x="26" y="134">pools with picks, brackets and live standings,</text>
  <text class="desc" x="26" y="154">shared over WhatsApp.</text>
  <line x1="26" y1="176" x2="404" y2="176" stroke="#d3dcec"/>
  <text class="stack" x="26" y="198">Next.js · Supabase · Prisma · Mercado Pago</text>

  <rect x="354.8" y="20" width="49.2" height="22" rx="11" fill="#e4eaf6" stroke="#d3dcec"/>
  <text class="badge" x="379.4" y="35" text-anchor="middle">LIVE</text>

